<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediKiosk — the history gets taken before the doctor does</title>
<meta name="description" content="MediKiosk captures a patient's clinical history and prior records before consultation, so a 3-minute OPD visit can spend its time on examination, not data entry.">
<style>
/*
  MediKiosk — design system
  ---------------------------------------------------------
  Grounded in the subject matter: a self-service clinical
  history kiosk for crowded Indian OPDs, used by first-visit,
  elderly, low-literacy and multilingual patients, and read
  by doctors in seconds. Visual language borrows from two
  real objects: the ruled paper case-sheet doctors write on,
  and the large-target, icon-first kiosk screen (ATM / airport
  check-in) patients tap through.
  Palette
    --paper   #F3F5F1  sage-white, like case-sheet paper
    --ink     #16221F  deep teal-charcoal text
    --teal    #0E6B57  clinical trust colour, primary action
    --ochre   #C17A2E  patient-facing accent (kiosk warmth)
    --rule    #CBD6C7  hairline / paper rule colour
    --alert   #A83A2C  reserved ONLY for red-flag emergencies
    --paper-2 #EAEEE7  slightly deeper paper, panels
  Type
    UI + body: IBM Plex Sans (also ships Devanagari — the
      product is bilingual, so this is a real constraint,
      not decoration)
    Data / IDs / timestamps: IBM Plex Mono, evokes a monitor
      readout / stamped patient ID
*/
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap');
:root{
  --paper:#F3F5F1;
  --paper-2:#EAEEE7;
  --ink:#16221F;
  --ink-soft:#4A5750;
  --teal:#0E6B57;
  --teal-deep:#0A4F41;
  --ochre:#C17A2E;
  --ochre-deep:#9A5F1F;
  --rule:#CBD6C7;
  --rule-strong:#A9B8A4;
  --alert:#A83A2C;
  --alert-bg:#F7E4DF;
  --focus:#1E5EFF;
  --radius:2px;
  --shadow:0 1px 0 rgba(22,34,31,.08);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans','Noto Sans Devanagari',sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'IBM Plex Sans','Noto Sans Devanagari',sans-serif;
  font-weight:600;
  line-height:1.2;
  margin:0 0 .5em;
  letter-spacing:-.01em;
}
h1{font-size:clamp(2rem,4vw,3.25rem); font-weight:700;}
h2{font-size:clamp(1.5rem,2.6vw,2.1rem);}
h3{font-size:1.25rem;}
p{margin:0 0 1em; max-width:38em; color:var(--ink-soft);}
a{color:var(--teal-deep); text-decoration-line:underline; text-decoration-color:var(--rule-strong); text-underline-offset:.15em;}
a:hover{text-decoration-color:currentColor;}
.mono{font-family:'IBM Plex Mono',monospace; letter-spacing:.01em;}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px;}
button{font-family:inherit; cursor:pointer;}
/* ---------- layout shells ---------- */
.wrap{max-width:1120px; margin:0 auto; padding:0 28px;}
.wrap--narrow{max-width:720px;}
.site-header{
  border-bottom:1px solid var(--rule);
  background:var(--paper);
  position:sticky; top:0; z-index:20;
}
.site-header__row{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 28px; max-width:1120px; margin:0 auto;
}
.brand{display:flex; align-items:baseline; gap:.5em; text-decoration:none; color:var(--ink);}
.brand__mark{
  display:inline-flex; align-items:center; justify-content:center;
  width:34px; height:34px; border:1.5px solid var(--ink); border-radius:50%;
  font-family:'IBM Plex Mono',monospace; font-size:.72rem; font-weight:600;
}
.brand__name{font-weight:700; font-size:1.15rem; letter-spacing:-.01em;}
.brand__name em{font-style:normal; color:var(--teal-deep);}
.header-nav{display:flex; gap:22px; align-items:center;}
.header-nav a{font-size:.95rem; text-decoration:none; color:var(--ink-soft);}
.header-nav a:hover{color:var(--ink);}


/* =========================================================
   TECH STACK BUTTON
   ========================================================= */

.tech-stack-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  padding:9px 14px;

  border:1px solid var(--rule);
  border-radius:8px;

  background:var(--paper);
  color:var(--ink);

  font-family:inherit;
  font-size:.88rem;
  font-weight:600;

  cursor:pointer;

  transition:
    background-color .15s ease,
    border-color .15s ease,
    color .15s ease,
    transform .15s ease;
}

.tech-stack-btn:hover{
  background:var(--paper-2);
  border-color:var(--teal);
  color:var(--teal-deep);
  transform:translateY(-1px);
}
/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5em;
  padding:14px 24px; font-size:1rem; font-weight:600;
  border:1.5px solid var(--ink); border-radius:var(--radius);
  background:transparent; color:var(--ink); text-decoration:none;
  min-height:52px; transition:background-color .12s ease, color .12s ease, transform .05s ease;
}
.btn:active{transform:translateY(1px);}
.btn--primary{background:var(--teal); border-color:var(--teal); color:#fff;}
.btn--primary:hover{background:var(--teal-deep); border-color:var(--teal-deep);}
.btn--patient{background:var(--ochre); border-color:var(--ochre); color:#fff;}
.btn--patient:hover{background:var(--ochre-deep); border-color:var(--ochre-deep);}
.btn--ghost{background:transparent; border-color:var(--rule-strong); color:var(--ink);}
.btn--ghost:hover{border-color:var(--ink);}
.btn--lg{padding:20px 30px; font-size:1.1rem; min-height:64px;}
.btn--block{width:100%;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}
/* ---------- stepper: the 5-step journey is a real sequence, so numbering is earned ---------- */
.stepper{display:flex; list-style:none; margin:0 0 32px; padding:0; gap:0; flex-wrap:wrap;}
.stepper li{
  display:flex; align-items:center; gap:10px;
  padding:10px 18px 10px 0; font-size:.85rem; color:var(--ink-soft);
  border-bottom:2px solid var(--rule); flex:1 1 auto; min-width:120px;
}
.stepper li .num{
  font-family:'IBM Plex Mono',monospace; font-size:.75rem;
  width:22px; height:22px; border-radius:50%; border:1.5px solid var(--rule-strong);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.stepper li.is-done{color:var(--teal-deep); border-color:var(--teal);}
.stepper li.is-done .num{background:var(--teal); border-color:var(--teal); color:#fff;}
.stepper li.is-current{color:var(--ink); font-weight:600; border-color:var(--ink);}
.stepper li.is-current .num{border-color:var(--ink); background:var(--ink); color:var(--paper);}
/* ---------- ruled paper panel: the case-sheet metaphor ---------- */
.sheet{
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 35px,
      var(--rule) 35px,
      var(--rule) calc(35px + 1px)
    );
  border:1px solid var(--rule-strong);
  padding:28px 30px;
  position:relative;
}
.sheet::before{
  content:"";
  position:absolute; top:0; left:44px; bottom:0; width:1px;
  background:var(--ochre); opacity:.35;
}
.sheet__label{
  font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--ink-soft);
  margin-bottom:6px; display:block;
}
.panel{
  background:var(--paper-2);
  border:1px solid var(--rule);
  padding:24px;
}
.panel + .panel{margin-top:16px;}
/* ---------- folder tabs (role select) ---------- */
.tabs{display:flex; gap:0; border-bottom:1px solid var(--rule-strong); margin-bottom:24px;}
.tabs button{
  flex:1; padding:14px 18px; background:var(--paper-2);
  border:1px solid var(--rule-strong); border-bottom:none;
  font-weight:600; color:var(--ink-soft);
  margin-right:-1px; position:relative; top:1px;
  border-radius:6px 6px 0 0;
}
.tabs button.is-active{background:var(--paper); color:var(--ink); top:0; border-bottom:1px solid var(--paper); z-index:1;}
/* ---------- form elements ---------- */
.field{margin-bottom:20px;}
.field label{display:block; font-weight:600; margin-bottom:6px; font-size:.95rem;}
.field .hint{font-size:.82rem; color:var(--ink-soft); margin-top:4px;}
.field input[type=text],
.field input[type=email],
.field input[type=password],
.field input[type=tel],
.field input[type=date],
.field select,
.field textarea{
  width:100%; padding:13px 14px; font-size:1rem; font-family:inherit;
  border:1.5px solid var(--rule-strong); border-radius:var(--radius);
  background:#fff; color:var(--ink);
}
.field textarea{min-height:96px; resize:vertical;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--ink);}
.choice-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
.choice{
  border:1.5px solid var(--rule-strong); background:#fff; border-radius:var(--radius);
  padding:16px 12px; text-align:left; font-size:.95rem; font-weight:500;
  min-height:64px; display:flex; align-items:center; gap:10px;
}
.choice:hover{border-color:var(--ink);}
.choice.is-selected{border-color:var(--teal); background:#EAF4F1; box-shadow:inset 0 0 0 1px var(--teal);}
.choice .ic{font-size:1.3rem; line-height:1;}
.severity{display:flex; align-items:center; gap:4px; flex-wrap:wrap;}
.severity button{
  width:44px; height:44px; border-radius:50%; border:1.5px solid var(--rule-strong);
  background:#fff; font-family:'IBM Plex Mono',monospace; font-weight:600;
}
.severity button.is-selected{background:var(--ink); color:var(--paper); border-color:var(--ink);}
/* voice / mic affordance */
.mic-btn{
  display:flex; align-items:center; justify-content:center;
  width:88px; height:88px; border-radius:50%;
  border:2px solid var(--teal); background:#fff; color:var(--teal);
  font-size:1.8rem; margin:0 auto;
}
.mic-btn.is-listening{background:var(--teal); color:#fff; animation:pulse 1.4s ease-out infinite;}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(14,107,87,.35);}
  100%{box-shadow:0 0 0 18px rgba(14,107,87,0);}
}
@media (prefers-reduced-motion: reduce){
  .mic-btn.is-listening{animation:none;}
}
/* ---------- stamp / status badge — modelled on a physical case-sheet stamp ---------- */
.stamp{
  display:inline-flex; align-items:center; gap:6px;
  font-family:'IBM Plex Mono',monospace; font-size:.72rem; font-weight:600;
  letter-spacing:.03em; padding:5px 10px; border:1.5px solid currentColor;
  border-radius:20px; transform:rotate(-1.5deg);
}
.stamp--pending{color:var(--ochre-deep);}
.stamp--ready{color:var(--teal-deep);}
.stamp--flag{color:var(--alert); background:var(--alert-bg); border-color:var(--alert); transform:rotate(-1.2deg);}
.stamp--done{color:var(--ink-soft);}
/* ---------- red-flag alert banner ---------- */
.alert-banner{
  background:var(--alert-bg); border:1.5px solid var(--alert); color:var(--alert);
  padding:16px 18px; display:flex; gap:12px; align-items:flex-start; margin-bottom:20px;
}
.alert-banner strong{display:block; color:var(--alert); margin-bottom:2px;}
.alert-banner p{color:var(--alert); margin:0; max-width:none;}
/* ---------- timeline (document scan step) ---------- */
.timeline{border-left:2px solid var(--rule-strong); margin-left:8px; padding-left:24px;}
.timeline__item{position:relative; padding-bottom:22px;}
.timeline__item::before{
  content:""; position:absolute; left:-30px; top:4px;
  width:10px; height:10px; border-radius:50%; background:var(--teal); border:2px solid var(--paper);
}
.timeline__date{font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--ink-soft);}
.timeline__body{background:#fff; border:1px solid var(--rule); padding:14px 16px; margin-top:6px;}
.abn{color:var(--alert); font-weight:600;}
/* ---------- doctor queue table ---------- */
.queue{width:100%; border-collapse:collapse;}
.queue th{
  text-align:left; font-family:'IBM Plex Mono',monospace; font-size:.72rem;
  text-transform:none; color:var(--ink-soft); font-weight:500;
  border-bottom:1.5px solid var(--ink); padding:8px 12px;
}
.queue td{padding:14px 12px; border-bottom:1px solid var(--rule); vertical-align:top;}
.queue tr.is-flagged{background:var(--alert-bg);}
.queue tr:hover{background:var(--paper-2);}
.queue a.row-link{color:var(--ink); text-decoration:none; font-weight:600;}
.queue a.row-link:hover{text-decoration:underline;}
/* ---------- summary sheet sections ---------- */
.hx-section{border-top:1px solid var(--rule); padding:18px 0;}
.hx-section:first-child{border-top:none;}
.hx-section h4{
  font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.78rem;
  color:var(--teal-deep); text-transform:none; margin-bottom:8px;
}
.hx-section dl{display:grid; grid-template-columns:180px 1fr; gap:6px 16px; margin:0;}
.hx-section dt{color:var(--ink-soft); font-size:.9rem;}
.hx-section dd{margin:0; font-size:.95rem;}
.lang-toggle{display:inline-flex; border:1.5px solid var(--rule-strong); border-radius:20px; overflow:hidden;}
.lang-toggle button{padding:6px 16px; background:#fff; border:none; font-size:.85rem; font-weight:600; color:var(--ink-soft);}
.lang-toggle button.is-active{background:var(--ink); color:var(--paper);}
footer.site-footer{border-top:1px solid var(--rule); margin-top:64px; padding:28px 0; color:var(--ink-soft); font-size:.85rem;}
/* utility */
.stack{display:flex; flex-direction:column; gap:14px;}
.row{display:flex; gap:14px; flex-wrap:wrap; align-items:center;}
.row.between{justify-content:space-between;}
.mt-0{margin-top:0;} .mt-1{margin-top:8px;} .mt-2{margin-top:16px;} .mt-3{margin-top:28px;} .mt-4{margin-top:48px;}
.mb-0{margin-bottom:0;}
.small{font-size:.85rem; color:var(--ink-soft);}
.center{text-align:center;}
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
.progress{height:4px; background:var(--rule); position:relative; margin-bottom:26px;}
.progress__fill{position:absolute; top:0; left:0; bottom:0; background:var(--teal); transition:width .25s ease;}
.section-tag{font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--ink-soft); display:block; margin-bottom:4px;}
.qa-nav{display:flex; justify-content:space-between; margin-top:24px;}
.chip{display:inline-block; padding:4px 10px; border:1px solid var(--rule-strong); border-radius:20px; font-size:.8rem; margin:0 6px 6px 0; background:#fff;}
.upload-zone{border:2px dashed var(--rule-strong); padding:36px 20px; text-align:center; background:var(--paper-2);}
.upload-zone.is-drag{border-color:var(--teal); background:#EAF4F1;}
.doc-card{border:1px solid var(--rule); background:#fff; padding:16px; margin-bottom:12px;}
.spinner{display:inline-block; width:16px; height:16px; border:2px solid var(--rule-strong); border-top-color:var(--teal); border-radius:50%; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.hero-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:56px; align-items:start;}
.journey-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:18px; margin-top:28px;}
@media (max-width: 900px){
  .journey-grid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width: 720px){
  .hero-grid{grid-template-columns:1fr; gap:32px;}
  .journey-grid{grid-template-columns:1fr;}
  .site-header__row{padding:14px 18px;}
  .wrap{padding:0 18px;}
  .header-nav{gap:14px;}
  .hx-section dl{grid-template-columns:1fr;}
  .sheet{padding:20px 18px;}
}
/* =========================================================
   TECH STACK MODAL
========================================================= */

.tech-stack-overlay{
  position:fixed;
  inset:0;
  z-index:9999;

  display:none;
  align-items:center;
  justify-content:center;

  padding:24px;

  background:rgba(10,30,25,.65);

  backdrop-filter:blur(6px);

  overflow-y:auto;
}

.tech-stack-overlay.active{
  display:flex;
}


.tech-stack-modal{
  width:min(1050px,100%);
  max-height:92vh;

  overflow-y:auto;

  background:var(--paper);

  border:1px solid var(--rule);

  border-radius:16px;

  box-shadow:
    0 30px 80px rgba(0,0,0,.25);

  animation:techModalIn .2s ease;
}


@keyframes techModalIn{

  from{
    opacity:0;
    transform:translateY(15px) scale(.98);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }

}


.tech-stack-header{

  display:flex;

  justify-content:space-between;

  gap:20px;

  padding:30px 32px 24px;

  border-bottom:1px solid var(--rule);

  background:var(--paper-2);

}


.tech-stack-label{

  margin-bottom:6px;

  color:var(--teal);

  font-family:'IBM Plex Mono',monospace;

  font-size:11px;

  font-weight:700;

  letter-spacing:.15em;
}


.tech-stack-header h2{

  margin:0;

  color:var(--ink);

  font-size:30px;

}


.tech-stack-header p{

  margin:8px 0 0;

  color:var(--ink-soft);

  font-size:14px;

}


.tech-stack-close{

  width:38px;
  height:38px;

  flex-shrink:0;

  border:1px solid var(--rule);

  border-radius:50%;

  background:var(--paper);

  color:var(--ink);

  font-size:25px;

  cursor:pointer;

}


.tech-stack-close:hover{

  background:var(--teal);

  color:#fff;

  border-color:var(--teal);

}


.tech-stack-content{

  padding:28px 32px 10px;

}


.tech-category{

  margin-bottom:34px;

}


.tech-category-title{

  display:flex;

  align-items:center;

  gap:13px;

  margin-bottom:17px;

}


.tech-icon{

  display:flex;

  align-items:center;

  justify-content:center;

  width:38px;
  height:38px;

  border-radius:9px;

  background:var(--teal);

  color:#fff;

  font-size:17px;

}


.tech-category-title h3{

  margin:0;

  font-size:18px;

}


.tech-category-title p{

  margin:3px 0 0;

  color:var(--ink-soft);

  font-size:12px;

}


.tech-grid{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:12px;

}


.tech-card{

  display:flex;

  align-items:flex-start;

  gap:14px;

  padding:17px;

  border:1px solid var(--rule);

  border-radius:11px;

  background:#fff;

  transition:
    transform .2s ease,
    border-color .2s ease;
}


.tech-card:hover{

  transform:translateY(-2px);

  border-color:var(--teal);

}


.tech-card-icon{

  display:flex;

  align-items:center;

  justify-content:center;

  flex:0 0 auto;

  width:48px;
  height:48px;

  border-radius:9px;

  background:var(--paper-2);

  color:var(--teal);

  font-family:'IBM Plex Mono',monospace;

  font-size:10px;

  font-weight:700;

}


.tech-card h4{

  margin:1px 0 5px;

  font-size:15px;

}


.tech-card p{

  margin:0;

  color:var(--ink-soft);

  font-size:12px;

  line-height:1.55;

}


.architecture-grid{

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:12px;

}


.architecture-card{

  padding:20px;

  min-height:145px;

  border:1px solid var(--rule);

  border-radius:11px;

  background:#fff;

}


.architecture-card span{

  display:inline-block;

  margin-bottom:12px;

  color:var(--teal);

  font-family:'IBM Plex Mono',monospace;

  font-size:10px;

  font-weight:700;

}


.architecture-card h4{

  margin:0 0 7px;

  font-size:14px;

}


.architecture-card p{

  margin:0;

  color:var(--ink-soft);

  font-size:12px;

  line-height:1.55;

}


.system-flow{

  display:flex;

  align-items:center;

  flex-wrap:wrap;

  gap:8px;

  padding:20px;

  border:1px solid var(--rule);

  border-radius:12px;

  background:var(--paper-2);

}


.flow-item{

  display:flex;

  flex-direction:column;

  gap:3px;

  padding:12px 14px;

  border:1px solid var(--rule);

  border-radius:8px;

  background:var(--paper);

  min-width:120px;

}


.flow-item span{

  color:var(--teal);

  font-family:'IBM Plex Mono',monospace;

  font-size:9px;

}


.flow-item strong{

  font-size:11px;

}


.flow-arrow{

  color:var(--teal);

  font-size:18px;

}


.tech-stack-footer{

  display:flex;

  align-items:center;

  gap:8px;

  padding:16px 32px;

  border-top:1px solid var(--rule);

  color:var(--ink-soft);

  font-family:'IBM Plex Mono',monospace;

  font-size:10px;

}


.tech-stack-footer span:first-child{

  color:var(--teal);

  font-weight:700;

}


/* =========================================================
   TECH STACK MOBILE
========================================================= */

@media (max-width:700px){

  .tech-stack-overlay{
    padding:10px;
  }

  .tech-stack-header{
    padding:22px;
  }

  .tech-stack-header h2{
    font-size:24px;
  }

  .tech-stack-content{
    padding:22px;
  }

  .tech-grid,
  .architecture-grid{
    grid-template-columns:1fr;

function initIntake() {

function initScan() {

        <div class="row"><span class="spinner"></span> Reading ${escapeHtml(file.name)}…</div>
      </div>`);

      `<div class="row between mb-0"><span>${i.name}</span><span class="${i.abnormal ? 'abn' : ''}">${i.value} ${i.unit} <span class="small">(ref ${i.refRange})</span></span></div>`

    const meds = (extracted.medications || []).length ? extracted.medications.map((m) => `<span class="chip">${m.name} ${m.dose} ${m.frequency}</span>`).join('') : '<span class="small">None listed</span>';

function initSummary() {
  renderHeader('site-header', { active: 'login' });
  renderStepper('stepper', 'summarize');
  const patientCtx = JSON.parse(sessionStorage.getItem('mediKiosk_patient') || 'null');
  const sessionCtx = JSON.parse(sessionStorage.getItem('mediKiosk_session') || 'null');
  const documentIds = JSON.parse(sessionStorage.getItem('mediKiosk_documents') || '[]');
  if (!patientCtx || !sessionCtx) { location.hash = '#/login?role=patient'; return; }
  const generatingStep = document.getElementById('generating-step');
  const steps = ['Structuring your answers…', 'Reading digitized documents…', 'Checking for anything urgent…', 'Writing the summary your doctor will see…'];
  let stepI = 0;
  const stepTimer = setInterval(() => { stepI = (stepI + 1) % steps.length; generatingStep.textContent = steps[stepI]; }, 650);
  let summary = null;
  let summaryId = null;
  let currentLang = 'en';
  (async () => {
    const structured = buildStructured(sessionCtx.chiefComplaintKey, sessionCtx.chiefComplaintLabel, sessionCtx.answers);
    const result = await MediKioskAPI.SummaryAPI.generate(patientCtx.patientId, {
      sessionId: sessionCtx.sessionId, documentIds, structured, redFlag: sessionCtx.redFlag,
    });
    clearInterval(stepTimer);
    summaryId = result.summaryId;
    summary = result.summary;
    showConfirm();
  })();
  function buildStructured(ccKey, ccLabel, answers) {
    const chronic = (answers.chronicConditions || []).filter((v) => !v.startsWith('None'));
    const family = (answers.family || []).filter((v) => !v.startsWith('None'));
    const habits = (answers.habits || []).filter((v) => !v.startsWith('None'));
    const ros = (answers.rosGeneral || []).filter((v) => !v.startsWith('None'));
    const structured = {
      chiefComplaint: `${ccLabel}${answers.onset ? ', onset ' + answers.onset.toLowerCase() : answers.duration ? ', duration ' + answers.duration.toLowerCase() : ''}.`,
      hpi: HistoryEngine.summarizeChiefComplaint(ccKey, answers, answers.describe),
      pastHistory: `${chronic.length ? 'Known: ' + chronic.join(', ') + '.' : 'No chronic conditions reported.'} ${answers.surgeries ? 'Surgical/hospital history: ' + answers.surgeries + '.' : ''}`.trim(),
      drugAllergy: `Regular medications: ${answers.medications || 'none reported'}. Allergies: ${answers.allergies || 'none reported'}.`,
      familyHistory: family.length ? `Family history of ${family.join(', ')}.` : 'No significant family history reported.',
      personalHistory: `${habits.length ? habits.join(', ') + '.' : 'No notable habits reported.'} ${answers.occupation ? 'Occupation: ' + answers.occupation + '.' : ''}`.trim(),
      ros: ros.length ? ros.join(', ') + '.' : 'No additional systemic symptoms reported.',
    };
    if (answers.prakriti || answers.agni || answers.koshtha || answers.aharaVihara) {
      structured.ayush = [
        answers.prakriti ? `Prakriti: ${answers.prakriti}` : '',
        answers.agni ? `Agni: ${answers.agni}` : '',
        answers.koshtha ? `Koshtha: ${answers.koshtha}` : '',
        answers.aharaVihara ? `Ahara-Vihara: ${answers.aharaVihara}` : '',
      ].filter(Boolean).join('. ') + '.';
    }
    return structured;
  }
  function showConfirm() {
    document.getElementById('phase-generating').style.display = 'none';
    document.getElementById('phase-confirm').style.display = '';

  function renderSheet() {
    const sheet = document.getElementById('summary-sheet');
    sheet.innerHTML = `<span class="sheet__label">${patientCtx.tokenNo || ''}</span>`;

    sheet.appendChild(inner);

  document.querySelectorAll('.lang-toggle button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.lang-toggle button').forEach((b) => b.classList.remove('is-active'));

    document.getElementById('btn-confirm').disabled = !e.target.checked;
  });
  document.getElementById('btn-confirm').addEventListener('click', async () => {
    const btn = document.getElementById('btn-confirm');
    btn.disabled = true; btn.textContent = 'Sending…';

    document.getElementById('phase-confirm').style.display = 'none';
    document.getElementById('phase-done').style.display = '';
    document.getElementById('token-display').textContent = result.opdToken;
    document.getElementById('abha-line').textContent = result.abhaLinked ? ' and linked to your ABHA record' : '';
    if (summary.redFlag) document.getElementById('priority-note').style.display = 'block';
  });
}
function initDashboard() {

  })();
  function timeAgo(iso) {
    const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if (mins < 1) return 'just now';
    if (mins === 1) return '1 min ago';
    return `${mins} min ago`;
  }
}
function initCaseDetail(params) {
  renderHeader('site-header', { active: 'dashboard' });
  const staff = JSON.parse(sessionStorage.getItem('mediKiosk_staff') || 'null');
  if (!staff || !localStorage.getItem('mediKiosk_staffToken')) { location.hash = '#/login?role=doctor'; return; }
  const summaryId = params.get('id');
  const queueCache = JSON.parse(sessionStorage.getItem('mediKiosk_queueCache') || '[]');
  const queueItem = queueCache.find((q) => q.summaryId === summaryId);
  if (!summaryId) { location.hash = '#/doctor-dashboard'; return; }
  (async () => {
    const summary = await MediKioskAPI.SummaryAPI.get(summaryId);
    if (!summary) {
      document.querySelector('#app').insertAdjacentHTML('beforeend', '<p class="wrap wrap--narrow">This case could not be found — it may have been generated in a different browser session.</p>');
      return;
    }
    document.getElementById('patient-header').innerHTML = `
      <div>
        <h2 class="mb-0">${queueItem ? queueItem.name : 'Patient ' + summary.patientId}</h2>
        <span class="small">${queueItem ? `${queueItem.age}, ${queueItem.gender} · Token ${queueItem.tokenNo || '—'}` : ''}</span>
      </div>
      ${summary.redFlag ? '<span class="stamp stamp--flag">priority</span>' : '<span class="stamp stamp--ready">ready</span>'}
    `;
    SummaryRender.renderRedFlagNote(document.getElementById('redflag-mount'), summary.redFlag, { mode: 'doctor' });
    document.getElementById('generated-note').textContent = summary.generatedAt ? `Generated ${new Date(summary.generatedAt).toLocaleTimeString()}` : '';
    const sheet = document.getElementById('summary-sheet');
    SummaryRender.renderSummarySheet(sheet, summary, { editable: true });
    if (summary.patientId) {
      const docs = await MediKioskAPI.DocsAPI.getTimeline(summary.patientId);
      if (docs.length) {
        document.getElementById('timeline-section').style.display = '';
        document.getElementById('timeline').innerHTML = docs.map((d) => `
          <div class="timeline__item">
            <div class="timeline__date">${d.extracted.date}</div>
            <div class="timeline__body">
              <strong>${d.extracted.docType}</strong> — ${d.extracted.provider}
              ${d.extracted.diagnoses.length ? `<div class="small mt-1">${d.extracted.diagnoses.join(', ')}</div>` : ''}
              ${d.extracted.investigations.filter((i) => i.abnormal).length ? `<div class="small abn mt-1">Abnormal: ${d.extracted.investigations.filter((i) => i.abnormal).map((i) => `${i.name} ${i.value}${i.unit}`).join(', ')}</div>` : ''}
            </div>
          </div>
        `).join('');
      }
    }
    document.getElementById('btn-confirm').addEventListener('click', async () => {
      const edits = {};
      sheet.querySelectorAll('textarea[data-field]').forEach((ta) => { edits[ta.dataset.field] = ta.value; });
      const btn = document.getElementById('btn-confirm');
      btn.disabled = true; btn.textContent = 'Saving…';
      await MediKioskAPI.SummaryAPI.doctorUpdate(summaryId, edits);
      btn.textContent = 'Confirmed ✓';
      document.getElementById('saved-note').style.display = 'block';
    });
  })();
}
/* ================================================================

const INITS = {
  home: initHome,
  login: initLogin,
  'patient-intake': initIntake,
  'document-scan': initScan,
  'summary-review': initSummary,
  'doctor-dashboard': initDashboard,
  'case-detail': initCaseDetail,
};
function parseHash() {
  let h = location.hash || '';
  h = h.replace(/^#\/?/, '');
  const qIdx = h.indexOf('?');
  const route = qIdx === -1 ? h : h.slice(0, qIdx);
  const qs = qIdx === -1 ? '' : h.slice(qIdx + 1);
  return { route: route || 'home', params: new URLSearchParams(qs) };
}
function renderRoute() {
  const { route, params } = parseHash();
  const key = TEMPLATES[route] ? route : 'home';
  document.getElementById('app').innerHTML = TEMPLATES[key];
  document.getElementById('site-footer').innerHTML = '';
  (INITS[key] || initHome)(params);
  window.scrollTo(0, 0);
}
